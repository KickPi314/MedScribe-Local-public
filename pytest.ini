# Test configuration (dev only; see requirements-dev.txt). The tests use
# synthetic data generated under pytest's tmp_path and never read samples/ or
# data/ -- tests/conftest.py fails any test that does.
#
# -p no:pastebin       pytest's pastebin plugin is the only code in pytest that
#                      can make a network call: with --pastebin it uploads the
#                      session log to bpaste.net. Disabled outright, so no flag
#                      can turn it on (spec section 1.1 applies to the dev tools
#                      too, and a failure log here can contain test data).
# -p no:cacheprovider  keeps pytest from writing .pytest_cache/ into the repo.
[pytest]
testpaths = tests
addopts = -p no:pastebin -p no:cacheprovider
