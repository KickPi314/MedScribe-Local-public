name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Same packages as requirements-dev.txt, but with headless OpenCV: the same
      # cv2 API as opencv-python, without the GUI system libraries a CI runner
      # does not have.
      - run: python -m pip install numpy pymupdf opencv-python-headless "pytest>=9.2"
      # One test runs the real segment stage, which needs the letterhead
      # templates this public copy does not ship; it reports as skipped (-rs).
      - run: python -m pytest -v -rs
