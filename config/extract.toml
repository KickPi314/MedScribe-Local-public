crop_file = "prescription_block_line_{index}.png"
segment_region = "prescription_block"
per_line = true
prompt = "prescription_line_v1"
prompt_b = "prescription_line_v2"
# The four transcribable keys of a Fixture.fields["prescriptions"] entry. The
# fifth, gujarati_marginalia_crop, is NOT here and must never be: spec section 4
# keeps the marginalia as an image crop for the human to read and explicitly
# forbids transcribing it ("a wrong administration instruction is a safety
# problem"). The marginalia is inside these crops -- it is on the right-hand end
# of nearly every line -- so both prompts tell the model to ignore it, and the
