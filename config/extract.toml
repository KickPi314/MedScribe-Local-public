#
# WHY THE DATE IS IN THE ASK EVEN THOUGH THE CROP DOES NOT CONTAIN IT: see
# [regions.header]. Asking and getting a null is the honest measurement, and it
# also tests the failure that matters here -- a 4B model inventing a date out of
# the printed "Registration No." digits that fall inside this crop on 4 of the 7
# pages. Measured: it does not.
text = """
This image is a crop of the first handwritten line of a paediatric prescription
slip. Reading it left to right, the line contains a patient reference number,
then the patient's full name.

Report exactly these three things as a JSON object:
  "patient_id"    the patient reference number, copied character for character,
                  including its letter and its dash if it has them
  "patient_name"  the patient's full name, exactly as written
  "date"          the visit date, ONLY if a date is written in this crop; copy
                  the digits and separators exactly as written, for example
                  "27/4/2025". Do not reformat it.

Rules:
- Copy what is written. Do not correct spelling, expand abbreviations, or
  normalise capitalisation.
- If something is not written in this crop, its value is null.
- If it is written but you cannot read it with certainty, its value is null. Do
  not report a name or a number you are unsure of.
- The crop may contain faint pre-printed words such as "Registration No." or
  "Additional Registration No.". That is printed stationery, not patient
  information. Ignore it and never take digits from it.

Reply with the JSON object and nothing else.
"""

[prompts.header_v2]
version = "header-v2"
# Content-first framing: three questions, asked in a different order (name
# first), with the rules attached to each question rather than listed at the end.
text = """
Look at this crop from a medical record and answer three questions about it.

1. What is the patient's full name, exactly as the handwriting spells it?
   Answer under the key "patient_name". If no name is legible, answer null.
2. Is there a patient reference or file number written on this line? It is
   usually a letter, a dash and four or five digits. Answer under the key
   "patient_id", copying it character for character. If there is none, or you
   cannot read every character of it, answer null.
3. Is a calendar date written anywhere in this crop? Answer under the key
   "date", copying it exactly as written, separators and all. If no date appears
   here, answer null. Do not derive a date from anything other than handwriting
   that is plainly a date.

Answer with one JSON object containing the keys "patient_name", "patient_id" and
"date", and no other text. An honest null is better than a plausible guess: this
is a medical record and a wrong name or number is worse than a blank one. Any
faint printed words in the image are part of the blank stationery and must be
ignored.
"""

[prompts.date_v1]
version = "date-v1"
