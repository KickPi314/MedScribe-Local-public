#     duration belongs to every line the brace spans;
#   * a leader line can run from one complaint to its own circled number, and two
#     complaints can share one circle that way.
# Naming "days" and "hours" is the one vocabulary this field is defined by -- the
# same allowance the leakage note above makes for a form being "Sy., Tab. or
# Inj.". It is a closed unit set, not a value: no complaint word, number or
# duration figure appears here.
text = """
This image is a crop from a handwritten paediatric prescription slip. It may
contain the patient's presenting complaints. Each complaint is written on its own
line, usually beginning with the abbreviation "c/o" (short for "complains of").

List every complaint you can read. For each one report:
  "text"           the complaint exactly as written, without the "c/o" prefix
  "duration"       how long the complaint has lasted, as a whole number, ONLY if
                   a number is written or circled beside it. Otherwise null.
  "duration_unit"  the unit that number is written in, read from the letters
                   written next to it: "days" or "hours". If a number is written
                   with no unit beside it, this is null. Never assume a unit that
                   is not written.

Reply with a single JSON object of the form:
  {"complaints": [{"text": "...", "duration": null, "duration_unit": null}]}

Rules:
- One entry per complaint line. Do not merge two lines or split one.
- Copy the words as written; do not expand abbreviations or correct spelling.
- A curly brace may gather several complaint lines together with a single circled
  number written against the brace. That number is the duration of EVERY
  complaint the brace spans: report it on each of those lines.
- A line may instead be joined to its number by a line drawn across to it, and
  two complaints may be joined to the same number. Again, report that number on
  each complaint joined to it.
- If this crop contains no complaint lines at all, reply with an empty list:
  {"complaints": []}. An empty list is a correct answer on this form.
- Do not include the diagnosis. A line beginning with a triangle or "D:" is the
  diagnosis, not a complaint.
- Do not include any line you cannot read with certainty.
"""

[prompts.complaints_v2]
# Same revision, same reason, as complaints_v1 above.
version = "complaints-v2r2"
# Content-first framing: ask what the patient came in with, without naming the
# "c/o" marker, and put the exclusions before the format.
#
# Rewritten: the withdrawn first draft named three example symptoms and the
# model returned them, with an invented duration of 2 days each, on a page that
# records no complaints at all. See the leakage note at the top of [prompts].
#
# The shared-duration reading that complaints_v1 describes as a brace and a
# leader line is put here as MEANING instead -- one number can belong to several
# symptoms at once -- so the two passes still differ in framing rather than in
# what they ask for.
text = """
This is a handwritten note from a paediatric clinic visit.

Your task: identify which symptoms the patient was brought in with. Each is a
short handwritten phrase on its own line. They are not always present -- on a
follow-up visit the doctor records none, and reporting none is the correct
answer then. Report only what this image actually shows: never name a symptom
that is not written here.

Do NOT report:
- the doctor's conclusion or diagnosis (often on a line marked with a triangle
  or "D:"),
- medicines, doses or instructions,
- anything you cannot read with certainty. Leaving a symptom out is safer than
  inventing one.

The doctor also records how long each symptom has been going on, as a circled
number with a unit beside it. One such number can belong to several symptoms at
once -- when it is written against a group of symptoms rather than a single one,
it is how long every symptom in that group has lasted, and it belongs to all of
them. The unit is written next to the number and is either days or hours; the
difference matters, so report the unit that is actually written and never supply
one that is missing.

Format your answer as JSON with a single key "complaints" holding an array. Each
element is an object with "text" (the symptom, transcribed exactly as written),
"duration" (the whole number written beside it, or null if none is), and
"duration_unit" ("days" or "hours" as written beside that number, or null if the
number carries no unit). If there are no symptoms recorded here, the array is
empty. Output only the JSON.
"""

