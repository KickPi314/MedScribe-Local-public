[prompts.diagnosis_v2]
version = "diagnosis-v2"
# Meaning-first framing, asked in the opposite order (the note first), with the
# two fields distinguished by what they mean rather than by their prefixes.
text = """
Read this handwritten clinical note and separate two different kinds of
statement in it.

First, the observation: a sentence describing how the patient is doing right
now, in the doctor's own words. Put it under the key "clinical_notes", copied
exactly, or null if the note contains no such sentence.

Second, the condition: the short medical name the doctor has given to what the
patient has -- one phrase, not a sentence. Put it under the key "diagnosis",
copied exactly, or null if no condition is named here.

Constraints:
- Transcribe, do not interpret. Keep the doctor's own spelling and word order.
  Never supply a diagnosis of your own, and never expand an abbreviation into
  what you think it stands for.
- If you cannot read a word with certainty, do not guess at it -- return null
  for that whole field.
- Ignore everything that is a prescription: drug names, quantities in ml,
  dosing abbreviations such as BD or OD, and any writing in Gujarati script.

Return one JSON object with the keys "clinical_notes" and "diagnosis". No other
output.
"""

[prompts.investigations_v1]
version = "investigations-v1"
# Layout-first framing: the arrow marker and the margin position.
#
# REWRITTEN. The withdrawn first draft named five real test abbreviations as
# examples and the model returned all five verbatim on two pages where nothing
# was requested -- see the leakage note at the top of [prompts]. No test name
# appears here now.
text = """
This image is a crop of the right-hand margin of a handwritten paediatric
prescription slip. It may contain a list of laboratory tests or scans that the
doctor has requested. Each is written as a short handwritten abbreviation,
usually after an arrow or a brace, one per line.

Report what is written there as a JSON object with one key:
  {"investigations": []}

Rules:
- One array element per requested test. Transcribe each one exactly as it is
  written on the slip, including any misspelling.
- Read only what is in this image. Do not add a test that is not written here,
  and do not complete a list from what usually goes together.
- The top of this crop may show body-measurement rows and their numbers. Those
  are measurements, not tests. Do not include them.
- A follow-up interval, such as a number of weeks or months, is not a test.
- If nothing is requested in this crop, the array must be empty. That is the
  correct answer on most of these slips and it is what you should return.
- Do not include an entry you cannot read with certainty.

Reply with the JSON object and nothing else.
"""

[prompts.investigations_v2]
version = "investigations-v2"
# Purpose-first framing: ask what was ordered, define the exclusions by what they
# are rather than by where they sit, and state the format last.
#
# Rewritten for the same reason as v1. The withdrawn first draft offered three
# plain-English examples and the model returned those three, in English, on
# three pages where nothing was requested.
text = """
A doctor has written a prescription slip. Some slips also order tests for the
patient to have done. Most do not.

Question: looking only at this image, which tests -- if any -- does the
handwriting order?

What counts: a test or scan the doctor has written down, transcribed exactly as
written, in the doctor's own abbreviation.
What does not count: body measurements and their numbers, dates, review
intervals, medicine names, and any word you cannot read confidently. Omitting an
unreadable entry is correct; guessing at one is not.

You must not name a test that is not written in this image. If the handwriting
orders nothing, say so with an empty list -- that is a correct and common
answer, not a failure.

Answer as JSON: {"investigations": [...]}, an array of strings, one per test, in
the order they are written. Return nothing but the JSON object.
"""

[prompts.prescription_line_v1]
version = "prescription-line-v1"
# Layout-first framing: describe the shape of the line, ask for its parts in
# written order.
#
# The "not a medicine line" escape matters and is measured: Phase 2 splits the
# block by ink projection, and the first band is often the "for <first name>:"
# heading rather than a drug. Without this instruction the model transcribes the
# heading as a product name, which would be a fabricated prescription.
#
# NO EXAMPLE VALUES, for the reason measured on the investigations and complaints
# prompts (see the note at the top of [prompts]): a drug name, a dose figure or a
# frequency code written into this prompt is a candidate answer the model can
# echo onto a line it cannot read, and every one of those four fields is scored.
# The withdrawn first draft used a real corpus drug ("Sy. Rinogel - 2.5ml x BD")
# and real corpus dose and frequency values as examples; it was rewritten before
# being measured rather than after, because the failure was already demonstrated
# twice elsewhere. What remains is field-defining vocabulary only -- what a form
# abbreviation IS, what units a dose is expressed in -- which is the question
# being asked, not a value that could be copied out.
text = """
This image is ONE line taken from the handwritten medicine list on a paediatric
prescription slip. The line usually reads:

  <form> <product name> - <dose> x <frequency>

where the form is a preparation abbreviation, short for syrup, tablet or
injection.

Report the four parts as a JSON object:
  "form"       the preparation abbreviation, exactly as written, or null if the
               line has none
  "product"    the medicine's name, including any strength written as part of
               it
  "dose"       the amount given at one time, as written -- a volume in ml, a
               number of drops, or a fraction of a tablet
  "frequency"  how often it is given, as written; usually a short abbreviation,
               sometimes with an interval in hours

Rules:
- Transcribe exactly. Do not correct a drug name to one you recognise, do not
  expand abbreviations, do not convert a dose to different units.
- Any value you cannot read with certainty is null. A wrong drug name or dose is
  dangerous; a null is not.
- There is often text in Gujarati script at the right-hand end of the line. It
  is an administration instruction. IGNORE IT COMPLETELY -- do not transcribe it,
  do not translate it, and do not let it change any of the four values.
- If this line is not a medicine at all -- for example a heading such as
  "for <name>:", a diagnosis, or a stray mark -- report null for all four keys.

Reply with the JSON object and nothing else.
"""

[prompts.prescription_line_v2]
version = "prescription-line-v2"
# Question-per-field framing, asked in a different order (product first, form
# last), with the safety rules attached to the fields they protect.
text = """
Below is a single line cut out of a doctor's handwritten medicine list. Answer
four questions about it and return the answers as one JSON object.

"product": which medicine is written here? Copy the name exactly as it appears,
including any number that is part of the name. Do not replace it with a similar
medicine name that you recognise -- if the handwriting does not clearly spell a
name, answer null.

"dose": how much is given each time? Copy the quantity as written, with its
unit. If no quantity is written, or it is unclear, answer null.

"frequency": how often is it given? This is usually a short abbreviation. Copy
it as written; answer null if none is written.

"form": does the line begin with a short abbreviation naming the preparation --
that is, marking it as a syrup, a tablet or an injection? Copy the abbreviation
exactly if there is one, answer null if there is not.

Two things in this image are NOT part of the answer. Writing in Gujarati script
is a note about when to take the medicine: ignore it entirely, and never attempt
to read or translate it. Long horizontal rule lines and tick marks are only
layout.

If the line contains no medicine at all -- it may be a heading naming the child,
or a leftover fragment -- then all four values are null. Return only the JSON
object.
"""

# ===========================================================================
[parse]
# ===========================================================================
# How a model reply becomes field values. The governing rule is spec section
# 1.3: a value that does not survive every check below is stored as null with a
# recorded reason. It is never repaired, never rounded into range, and never
# replaced by a nearby plausible number. The raw reply is kept alongside the
# parsed result for debugging -- as evidence, never as a fallback value.

# When the reply is not valid JSON, retry once on the substring from the first
# "{" to the last "}". This recovers a model that wrapped its object in a code
# fence or a sentence. It is a syntax repair on the envelope only and cannot
# alter a digit; if it also fails, every field is null and parse_ok is false.
salvage_braces = true

# Reply strings meaning "no value here", compared case-insensitively after
# trimming. These are recorded as a genuine ABSENCE (the model asserting the
# slip has no MAC value, which is the correct answer on 3 of the 7 real pages),
# which the eval harness scores separately from an unreadable value. A JSON
# null, or a key the model omitted entirely, is treated the same way.
null_tokens = ["", "null", "none", "n/a", "na", "nil", "-", "--", "not recorded",
               "not visible", "unreadable", "unknown", "?"]

# Unit text stripped from a value before it is parsed as a number. Tokens are
# removed from either end, case-insensitively, and this is the ONLY editing done
# to a value.
#
# Justified because it cannot change a digit: it deletes non-numeric characters
# the prompt asked the model not to emit, and anything left over that is not a
# number still becomes null. MEASURED need -- qwen3-vl:4b returned spo2_pct as
# the string "100%" and wt_kg as "5.990" on the same page despite the "bare
# number" instruction, so a strict float() parse would have thrown away a
# correctly-read SpO2. Deleting "%" is transcription; inferring 100 from "1oo"
# would not be, and is not done.
strip_tokens = ["%", "kg", "kgs", "cm", "cms", "f", "°f", "° f", "degf", "deg f",
                "bpm", "/min", "beats/min", "°"]

# Thousands separators are removed before parsing (a model writing "1,470" for a
# heart rate). The value still has to pass its plausibility range.
strip_thousands_separator = true

# How to read a date that the model reported AS WRITTEN, e.g. "27/4/2025".
# "dmy" = day, month, year. "mdy" = month, day, year.
#
# THE DECISION, and why it is a reformat rather than an inference. The prompts
# ask the model to copy the date exactly as the doctor wrote it, and this parser
# reorders the three digit groups into the ISO 8601 the fixtures store
# ("2025-04-27"). No information is added: the same digits come out zero-padded
# in a different order. That is unlike converting 37.2 C into 99.0 F, which
# would invent a number the slip does not contain -- so it does not break the
# "do not calculate, convert or correct" rule, which is about VALUES.
#
# The rejected alternative was to ask the model for ISO directly. It was rejected
# because it makes a 4B VLM perform the one transformation whose failure is
# unrecoverable and invisible: a silent day/month swap produces a perfectly
# valid-looking date, and the written form -- the evidence -- would be gone.
# Doing it here keeps the raw reply on record and puts the rule in a file the
# operator can read.
#
# "dmy" because that is this clinic's convention, visible in every sample
# filename and confirmed by the ground truth: a slip dated 27/4/2025 is stored
# as 2025-04-27. Six of the seven have a day > 12
# or a month > 12 somewhere in the corpus, so the convention is not a guess.
#
# WHAT THE PARSER REFUSES TO DO (src/extract/parse.py:_to_date):
#   - expand a two-digit year. "19/6/26" could be 1926 or 2026; choosing is
#     inventing a century, so the date is withheld with that reason.
#   - swap day and month to rescue an impossible date. If "19/6" is read under
#     an "mdy" order it becomes month 19, which is refused rather than quietly
#     re-read as June 19 -- silently picking the arrangement that happens to be
#     valid is precisely the plausible-looking guess spec section 1.3 forbids.
#   - accept anything that is not exactly three groups of digits.
# A date already written in ISO order (a four-digit first group) is accepted as
# ISO, so a model that reformats on its own is not punished for it.
date_order = "dmy"

# ===========================================================================
[fields]
# ===========================================================================
# One table per field, keyed exactly as Fixture.fields["vitals"] is keyed in
# src/eval/fixtures.py.
#
# `min`/`max` implement spec section 4.3's "Vitals must parse as numbers within
# plausible paediatric ranges". In Phase 3 an out-of-range value becomes null
# with the reason recorded -- the value is withheld, per spec section 1.3.
# Phase 5 turns that withholding into the `flagged` field state and surfaces the
# reason in the review UI; that state machine does not exist yet, so nothing
# here pretends to be a flag.
#
# The ranges are DELIBERATELY WIDE. They are a nonsense filter, not a clinical
# range: their job is to catch a decimal point read in the wrong place or a
# label's value read off the wrong row, not to second-guess a legitimately
# unusual observation. A narrow range would discard correct readings, and
# discarding a correct reading is the failure spec section 1.3 cares most about
# after inventing one. `decimals` sets the rounding used for comparison and for
# storage; it is set from how the values are actually written on these slips.
#
# `aliases` are alternative JSON keys accepted from the model, matched
# case-insensitively. Key spelling is not a transcribed value, so accepting
# "wt" for "wt_kg" invents nothing -- it only stops a correctly-read number
# being thrown away because the model renamed its own key.
#
# PHASE 4 ADDS A `type` KEY. Phase 3 had only numbers, so `type` defaults to
# "number" and the six vitals tables below are unchanged. The other types are
# text, date, string_list and complaint_list, and each has its own required
# keys (src/extract/config.py enforces them):
#
#   number          min, max, decimals      a value outside [min, max] is withheld
#   text            max_chars               a longer value is a runaway generation,
#                                           withheld in full rather than truncated
#   date            min_year, max_year      see [parse].date_order
#   string_list     max_items, max_item_chars
#   complaint_list  max_items, max_item_chars, min/max_duration, duration_units
#
# The ceilings play the same role for text that the plausibility ranges play for
# numbers, and they are set the same way: WIDE, as a nonsense filter rather than
# a style rule. Their job is to catch a model that has stopped transcribing and
# started narrating, not to second-guess a long diagnosis.

[fields.wt_kg]
label = "Wt"
aliases = ["wt", "weight", "weight_kg", "wt(kg)", "wtkg"]
# Ground truth on the real corpus spans 5.99-24.82 kg. Range covers a preterm
# neonate to an obese adolescent; this is a paediatric clinic, but the slip is
# not guaranteed to be a child's.
min = 0.3
max = 150.0
decimals = 2

[fields.temp_f]
label = "T"
aliases = ["t", "temp", "temperature", "temp_f", "t_f", "temperature_f"]
# Ground truth spans 97.1-100.8 degF. Range spans survivable hypothermia to
# extreme hyperpyrexia. A Celsius reading (e.g. 37.2) falls BELOW this range and
# so becomes null with a reason, which is correct: converting it would be the
# "do not calculate, convert or correct" rule broken by the parser instead of by
# the model.
min = 90.0
max = 112.0
decimals = 1

[fields.spo2_pct]
label = "Spo2"
aliases = ["spo2", "sp02", "spo2_percent", "saturation", "sats", "o2_sat", "spo2pct"]
# Ground truth spans 98-100%. 100 is a hard ceiling: a saturation cannot exceed
# it, so a reply of "100.1" -- which this model produced once, reading the
# printed "%" as a digit -- is provably a misread and is withheld rather than
# rounded down to 100. Rounding it would be guessing the intended value.
min = 40.0
max = 100.0
decimals = 0

[fields.hr]
label = "HR"
aliases = ["heart_rate", "pulse", "hr_bpm", "heartrate"]
# Ground truth spans 103-147 bpm. Range spans a sleeping athlete to neonatal
# tachycardia.
min = 30.0
max = 260.0
decimals = 0

[fields.mac_cm]
label = "MAC"
aliases = ["mac", "mid_arm_circumference", "muac", "mac(cm)"]
# Recorded on 4 of the 7 real pages (14-17 cm); genuinely absent on the other 3.
min = 5.0
max = 45.0
decimals = 1

[fields.abd_cm]
label = "Abd"
aliases = ["abd", "abdomen", "abdominal_circumference", "abd_girth", "abd(cm)"]
# Recorded on 4 of the 7 real pages (39.5-55 cm); genuinely absent on the other 3.
min = 15.0
max = 150.0
decimals = 1

# --- Phase 4 fields --------------------------------------------------------

[fields.patient_id]
label = "Patient ID"
type = "text"
aliases = ["id", "patient_no", "patient_number", "file_no", "reg_no", "uhid"]
# Spec section 4.3 requires this to match J-\d{4,5} EVENTUALLY. That check is
# NOT implemented here, deliberately: section 4.3 is a list of VALIDATION rules
# whose failures produce the `flagged` field state, and that state machine is
# phase 5. Phase 4 transcribes what is written -- if the doctor wrote "J-1234"
# or "12345", that is what the human reviewer needs to see, not a null with the
# reason "did not match a regex". Adding the regex here would also make Phase 4
# silently responsible for a rejection decision nobody has measured yet.
#
# 40 characters is generous for a five-digit reference; it only catches a model
# that has started describing the image instead of reading the number.
max_chars = 40

[fields.patient_name]
label = "Patient name"
type = "text"
aliases = ["name", "patient", "full_name", "patients_name"]
# Longest name in the corpus is 24 characters.
# 80 leaves room for a longer one without admitting a sentence.
max_chars = 80

[fields.date]
label = "Date"
type = "date"
aliases = ["dt", "visit_date", "date_of_visit", "slip_date"]
# Corpus spans late 2024 to mid 2026. The range is a nonsense filter: it
# catches a year read off a registration number or a phone number, and nothing
# narrower is defensible for a clinic that will keep using this next year.
min_year = 2000
max_year = 2100

[fields.complaints]
label = "Complaints"
type = "complaint_list"
aliases = ["complaint", "presenting_complaints", "symptoms", "c/o", "co"]
# Observed 0 or 3 complaints per page on the real corpus. 12 is a nonsense
# ceiling; a reply listing 12 complaints has started enumerating words on the
# page rather than reading c/o lines.
max_items = 12
# Longest ground-truth complaint text is 11 characters ("THROAT PAIN").
max_item_chars = 120
# The duration NUMBER, whatever unit it is written in. 0 is allowed ("since
# today"); 365 catches a model that has read a year or a phone number as a
# duration. One bound for both units rather than one pair per unit: this is a
# nonsense filter, and 365 is loose in days and very loose in hours, which is the
# right direction for a filter whose job is to reject a phone number and not to
# second-guess a doctor. Ground truth spans 1-2 in both units.
min_duration = 0
max_duration = 365

# THE CLOSED SET OF UNITS, and the only place one is recognised. The key is the
# canonical unit that ground truth records; the list is the spellings accepted
# from the model, matched case-insensitively. A number whose unit is in no list
# withholds the whole complaints list rather than defaulting to days -- the slips
# genuinely use both scales (2 of the 3 pages with complaints write a "d"/"dy"
# glyph, the third writes "HRS"), so "2" read as 2 days would be a fabricated
# timescale, off by a factor of 24. Accepting the short spellings is not a guess
# for the same reason an alias is not: a unit's spelling is not a quantity.
[fields.complaints.duration_units]
days = ["day", "d", "dy", "dys"]
hours = ["hour", "hr", "hrs", "h"]

[fields.diagnosis]
label = "Diagnosis"
type = "text"
aliases = ["dx", "d", "impression", "condition"]
# Longest in the corpus is 39 characters ("IMPROVING PHARYNGITIS WITH NOSE
# BLOCKING"). 200 admits a longer one and refuses a paragraph.
max_chars = 200

[fields.clinical_notes]
label = "Clinical notes"
type = "text"
aliases = ["notes", "note", "clinical_note", "observation", "remarks"]
# Longest in the corpus is 29 characters ("AT PRESENT CLINICALY STABLE").
# 400 is deliberately loose: this is the field most likely to legitimately be a
# whole sentence, and losing a real note to a ceiling would be the worse error.
max_chars = 400

[fields.investigations]
label = "Investigations"
type = "string_list"
aliases = ["investigation", "tests", "labs", "advise", "plan"]
# Observed 0 or 4 per page. 15 catches a runaway enumeration.
max_items = 15
# Longest in the corpus is 19 characters ("URINE RUTINE MICRO").
max_item_chars = 60

[fields.form]
label = "Form"
type = "text"
aliases = ["preparation", "type", "dosage_form"]
# "Sy.", "Tab.", "Inj." -- 20 characters is already 5x the longest real value.
max_chars = 20

[fields.product]
label = "Product"
type = "text"
aliases = ["drug", "medicine", "medication", "name", "product_name", "brand"]
# Longest in the corpus is 19 characters ("MULMINA TETRAPACK"). 80 admits a
# long brand-plus-strength string.
#
# NOTE what is NOT here: any fuzzy match against a formulary. Spec section 4.2's
# formulary matching and section 5's alias list are phase 5, and spec section 10
# forbids normalising an uncertain drug name to the nearest known entry. This
# field is transcription only.
max_chars = 80

[fields.dose]
label = "Dose"
type = "text"
aliases = ["dosage", "amount", "quantity", "strength"]
# "2.5ML", "4 DROPS", "1/2". Kept as TEXT rather than parsed into a number and a
# unit: "1/2" (half a tablet) is a real ground-truth value, and a numeric parse
# would either discard it or convert it to 0.5, which is a value the slip does
# not contain. Spec section 4.4's dose sanity check is phase 5 and will do its
# own parsing against a known concentration.
max_chars = 40

[fields.frequency]
label = "Frequency"
type = "text"
aliases = ["freq", "schedule", "timing", "how_often"]
# "BD", "OD", "TDS", "SOS 6 HOURLY". Spec section 4.3's "frequency must be in a
# known set" is a VALIDATION rule and is phase 5; nothing here rejects an
# unknown frequency, it is transcribed as written.
max_chars = 40

# ===========================================================================
[cache]
# ===========================================================================
# Spec section 3.5: "Cache results per (image hash, region, model, prompt
# version) so re-runs and re-tuning don't recompute everything." All four parts
# are in the key, and all four are stored in plain text inside each cache entry
# so an entry can be audited without recomputing its key.
#
# The image hash is sha256 of the crop PNG's exact bytes -- not of the source
# page. That is the stricter and more useful choice: re-tuning a region box in
# config/segment.toml produces different crop bytes and therefore a cache MISS,
# which is right, because the model would have been shown a different picture.
enabled = true

# Under data/out/, which .gitignore already excludes as patient-derived. These
# entries hold extracted vitals values and the model's raw reply about a real
# patient, so they are PHI in the same way data/dumps/ and data/segments/ are.
dir = "data/out/extract_cache"

# Hash algorithm and the prefix length used in the cache filename. The full
# digest is stored inside the entry; the filename is truncated only to stay
# readable and well under Windows' path limit. 16 hex chars = 64 bits, which is
# collision-free for a corpus this size by an enormous margin, and the loader
# re-checks the full digest inside the file before trusting an entry, so a
# truncated-prefix collision cannot return the wrong page's values.
hash_algorithm = "sha256"
filename_hash_chars = 16

# Cache FAILURES too (unreachable server, timeout, unparseable reply)? No.
# A failure is usually a property of the environment rather than of the
# (image, region, model, prompt) tuple -- Ollama was not running, the model was
# still loading -- and caching it would make a transient outage look like a
# permanent inability to read a page. Failures are always retried.
store_failures = false

# ===========================================================================
[output]
# ===========================================================================
# Per-page extraction results, one JSON per page: parsed fields, the raw reply,
# the reason for every null, and the full cache key. This is the debugging
# artefact -- the cache is keyed for machine lookup, this is keyed for a human
# ("what did the model actually say about page X").
#
# Also under data/out/ and also PHI: these files contain a real patient's
# observations.
dir = "data/out/extract"
write_per_page_json = true

# Put the prompt version in the artefact filename?
#
# TRUE, and Phase 4 needs it to be. Phase 3 wrote <page_id>.<region>.json, which
# was unambiguous when each region ran once. With two passes per region the
# second pass would overwrite the first and the file on disk would silently be
# "whichever pass happened to run last" -- an artefact whose provenance you
# cannot tell by looking at it. The line number is always included for the same
# reason (one prescription block is 4-7 crops). Set false only if some external
# tool depends on the Phase 3 filenames.
filename_includes_prompt_version = true

# Two-pass comparison artefacts, one JSON per compared crop: both passes' values,
# both statuses, and the per-field agreement boolean. NOT a resolved answer --
# see the `not_implemented` block inside each file, and src/extract/agreement.py.
# PHI, under data/out/ like everything else here.
agreement_dir = "data/out/extract_agreement"
write_agreement_json = true
