crop_file = "complaints_block.png"
segment_region = "complaints_block"
prompt = "complaints_v1"
prompt_b = "complaints_v2"
fields = ["complaints"]

[regions.complaints.model_options]
num_ctx = 8192

[regions.diagnosis]
# ONE crop, TWO fixture fields. config/segment.toml calls this box "deliberately
