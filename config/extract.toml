# ===========================================================================
[prompts]
# ===========================================================================
# Prompt text is CONFIG, not code, for two reasons. It is the single most
# iterated-on artefact in the whole extraction stage, and spec section 3.5 makes
# the prompt version part of the cache key -- which is only meaningful if a
# prompt edit is a visible, versioned config change rather than a diff buried in
# a Python string literal.
#
# VERSIONING RULE: change the text, change the `version` string. Nothing
# enforces it (the text is not hashed into the key on purpose -- an edit that
# only fixes a typo should not orphan a whole cache), so it is a discipline. If
# you edit text without bumping the version, run with --refresh.
#
# ---------------------------------------------------------------------------
# NEVER PUT A REAL EXAMPLE VALUE IN A PROMPT. Measured, and the single most
# important thing learned while writing these.
# ---------------------------------------------------------------------------
# The first Phase 4 drafts of the investigations and complaints prompts named
# example values, in the ordinary way one writes a prompt:
#
#   investigations_v1  "...short abbreviations such as CBC, SGPT, SGOT, CRP or USG"
#   investigations_v2  "...a blood count, a liver enzyme, an ultrasound"
#   complaints_v2      "...such as a fever, a cough, or pain somewhere"
#
# On the real scans, qwen3-vl:4b returned THE EXAMPLES THEMSELVES as answers on
# pages where nothing was written. Measured on the first drafts, which carried
# the same version strings as the rewrites below -- their cache entries were
# discarded with --refresh, so nothing here is served from them:
#
#   page 20fd (no investigations recorded)  -> ["CBC","SGPT","SGOT","CRP","USG"]
#   page 8a83 (no investigations recorded)  -> ["CBC","SGPT","SGOT","CRP","USG"]
#   pages 20fd, 8a83, fd12 (none recorded)  -> ["blood count","liver enzyme",
#                                               "ultrasound"]
#   page e6a8 (no complaints recorded)      -> fever / cough / vomiting, each
#                                               with a duration of 2 days
#
# That is a fabricated clinical value produced by the prompt, on 4 of 7 pages --
# precisely what spec section 1.3 and section 10 forbid, arriving through the
# one channel a parser cannot catch, because "CBC" is a perfectly well-formed
# investigation. It also poisons the section 4.1 agreement signal: two prompts
# that leak get two DIFFERENT fabrications and disagree loudly, while two prompts
# that leak the same list would agree confidently on a fiction.
#
# Every prompt below therefore describes what a field IS and never what it might
# CONTAIN. The vocabulary that defines a field is still allowed (a form is "Sy.,
# Tab. or Inj."; a dose is "a volume in ml, a number of drops or a fraction of a
# tablet"; a duration unit is "days or hours", the closed set the slips use)
# because that is the question, not a candidate answer -- but no test
# name, no drug name, no dose figure, no frequency code and no complaint word
# appears anywhere in a prompt.
#
# THE ONE DELIBERATE EXCEPTION, checked rather than assumed: header_v1 gives a
# date format example ("27/4/2025"). Measured on all 7 pages, the model returned
# null for the date every time and never echoed it -- which is the correct answer,
# since the date is in no crop (see [regions.header]).
#
# THAT EXCEPTION WAS RE-CHECKED when the date got its own region (2026-08-17), as
# the line above said it should be, and it was NOT carried over. header_v1 keeps
# its example because its crop still provably contains no date, so an echo there
# is measurable as a false positive against a known-empty rectangle. date_v1 and
# date_v2 are read from a crop that contains a real date on 7 of 7 pages, so an
# example date there would sit next to an illegible one as a ready-made answer --
# the leakage above, on the one field where it could not be detected. Neither
# date prompt contains a date, a year, or a separator style.
#
# TWO PROMPTS PER REGION (Phase 4, spec section 4.1: "Run each region twice with
# differently-worded prompts. Disagreement between passes is your strongest error
# signal. Cost is 2x, worth it.")
#
# The `_v1` and `_v2` prompt for a region ask for THE SAME FIELDS in THE SAME
# JSON SHAPE and differ in how the ask is framed. That is the point: a rewording
# that only shuffles a few adjectives would agree with itself by construction and
# the agreement rate would measure nothing. Each pair below differs in at least
# three ways -- the order the fields are asked for, whether the crop is described
# by LAYOUT ("the printed labels run down the left") or by CONTENT ("find the
# sentence that names a condition"), and whether the never-guess rules come
# before or after the field list. Two systematically different framings can still
# induce the same misreading, and when they do the eval harness reports it: the
# `both wrong and agreeing` count is measured, not assumed away.
#
# NEITHER PASS IS THE ANSWER. src/extract/agreement.py records both values and
# never picks between them. Resolution is phase 5.

[prompts.vitals_v1]
version = "vitals-v1"
# NARROW AND SINGLE-PURPOSE, per spec section 3.4: "Read the vitals column,
# output JSON with keys wt/temp/spo2/hr" beats "transcribe this page" on both
# accuracy and speed. So this prompt names the six labels, the units they are
# recorded in, and nothing else. It does not ask for the date (a different
# field), the patient name (a different region), or any interpretation of the
# numbers -- spec section 1.4, the app transcribes and does not advise.
#
# The three "null" rules are the prompt-side half of spec section 1.3. The
# parse-side half is in [fields.*] below and in src/extract/parse.py, and it does
# not trust the model to have obeyed these instructions.
text = """
This image is a crop of the vitals column from a handwritten paediatric
prescription slip. The printed labels run down the left-hand side of the crop.
The handwritten value for each label is immediately to the right of it.

Read only these labels, and report each one's handwritten value:
  Wt   -> key "wt_kg"     body weight, in kilograms
  T    -> key "temp_f"    temperature, in degrees Fahrenheit
  Spo2 -> key "spo2_pct"  oxygen saturation, in percent
  HR   -> key "hr"        heart rate, in beats per minute
  MAC  -> key "mac_cm"    mid-arm circumference, in centimetres
  Abd  -> key "abd_cm"    abdominal circumference, in centimetres

Reply with one JSON object containing exactly those six keys, and nothing else.

Rules:
- Every value must be a bare number: no units, no percent sign, no quotes.
- Copy the digits exactly as they are written, including the decimal point.
- If a label has no handwritten value on this slip, its value is null.
- If a value is written but you cannot read it with certainty, its value is
  null. Do not report a number you are unsure of.
- Do not calculate, convert, correct, round or estimate any value.
- Ignore the date, any printed registration number, and any other handwriting
  in the crop.
"""

[prompts.vitals_v2]
version = "vitals-v2"
# PASS B for the vitals column. vitals_v1 above is untouched and stays the
# measured 38/42 configuration.
#
# Differently worded in three ways rather than reworded: the never-guess rules
# come FIRST instead of last, the task is framed as reading rows of a table
# (label then value) rather than as a list of labels to look up, and the units
# are attached to the reading instruction rather than to the key list. The keys
# and the JSON shape are identical, because the two passes have to be comparable
# field by field.
text = """
You are transcribing one column of a handwritten paediatric prescription slip.
Accuracy matters more than completeness. Before you answer, apply these rules:

- Report a number only if you can read every digit of it with certainty.
- If any digit is ambiguous, report null for that row instead of your best
  guess.
- If a row has no handwritten value at all, report null for it.
- Never convert between units, never round, never fill in a value from context.

The crop is a small table. Each row has a printed label on the left and one
handwritten value written next to it. Work down the rows and read the
handwritten value on each one:

  the Wt row   holds a weight in kilograms         -> key "wt_kg"
  the T row    holds a temperature in Fahrenheit   -> key "temp_f"
  the Spo2 row holds a percentage                  -> key "spo2_pct"
  the HR row   holds a heart rate                  -> key "hr"
  the MAC row  holds a length in centimetres       -> key "mac_cm"
  the Abd row  holds a length in centimetres       -> key "abd_cm"

Output a single JSON object with exactly those six keys. Each value is either a
bare number, written with the same digits and decimal point as on the slip, or
null. Do not include units, symbols or any text outside the JSON object.
"""

[prompts.header_v1]
version = "header-v1"
# Layout-first framing: describe the row left to right, then ask for the fields
