# MedScribe Local -- VLM field extraction configuration (Phases 3-4, spec
# sections 3.2 / 3.4 / 3.5 / 4.1)
#
# EVERY tunable for extraction lives in this file. Nothing in src/extract/
# hardcodes a host, a port, a model name, a prompt, a sampling parameter or a
# plausibility range. Edit here, re-run, compare:
#
#   python -m src.extract probe            # is Ollama up, is the model pulled
#   python -m src.extract vitals           # extract the vitals region, 7 pages
#   python -m src.extract regions          # all six regions, BOTH prompts
#   python -m src.extract regions --refresh --region diagnosis
#   python -m src.eval vitals              # Phase 3 vitals accuracy
#   python -m src.eval extract             # Phase 4: all regions + agreement
#
# SCOPE. Phase 3 (spec section 9 item 3) extracted ONE region -- the vitals
# column, the spec's own worked example in section 3.4 -- and measured it.
# Phase 4 (item 4) adds the other five regions from section 3.4 and the two-pass
# agreement signal from section 4.1: every region now names TWO differently
# worded prompts and is run through both, with the per-field agreement recorded
# as a signal and never resolved into an answer. Formulary matching (section
# 4.2), the dose sanity check (section 4.4) and the confirmed/extracted/flagged
# field-state machine (section 4) remain phase 5 and nothing here anticipates
# them.
#
# ---------------------------------------------------------------------------
# PHASE 4 MEASURED RESULT with the settings in this file
# ---------------------------------------------------------------------------
# `python -m src.eval extract` over the same 7 real clinic scans, qwen3-vl:4b,
# scored against the doctor-verified fixtures. Pass A (the *_v1 prompts):
#
#   region             exact-match acc   CER (mean / char-weighted)   emitted wrong
#   header              2/21  0.095      0.217 / 0.232 (name only)     13
#   vitals             38/42  0.905      n/a (numeric, exact match)     3
#   complaints          0/7   0.000      0.170 / 0.167                  7
#   diagnosis           3/14  0.214      0.820 / 0.863                 11
#   investigations      0/7   0.000      0.250 / 0.250                  7
#   prescription_line   3/48  0.062      0.857 / 0.668                 45
#
#   two-pass agreement  79/247 = 0.320 overall; 65/189 = 0.344 restricted to
#   fields where both passes read a value. Of the agreements, 29 fields agreed
#   AND WERE WRONG -- agreement is a signal, not a certificate. 6 fields
#   disagreed while pass A was right (phase 5's future false alarms).
#
# HONEST READING OF THOSE NUMBERS. Vitals is unchanged from Phase 3 and is the
# only region a 4B VLM handles well here; it is also the easiest -- printed
# labels, short numeric values, a tight crop. Everything else is hard
# handwriting in a loose crop, and the model fails in three distinct ways worth
# naming because phases 5 and 6 are built on top of them:
#
#   1. IT SUBSTITUTES ITS PRETRAINING PRIOR FOR THE HANDWRITING. On illegible
#      prescription lines it returns textbook drug names and textbook dosing
#      codes that appear nowhere in this clinic's vocabulary -- "Chlorpheniramine",
#      "Ceftriaxone", "phenobarbital", "Dextromethorphan", and frequencies
#      "t.i.d." / "q8h" / "q.d." where the slips only ever use BD / OD / TDS /
#      SOS. No prompt here names a drug or a frequency code (see the leakage note
#      under [prompts]), so this is the model's prior, not an echo. It is the
#      most dangerous failure in the whole system: a fluent, plausible,
#      completely invented prescription. It is also exactly what spec section
#      4.2's formulary match and section 4.1's agreement signal exist to catch --
#      frequency agreement between the two passes is 1/26 = 0.038.
#   2. IT ANSWERS WHEN THERE IS NOTHING TO READ. investigations pass A returns a
#      list on all 7 pages although only 2 requested anything; complaints returns
#      3 entries on pages that record none. An empty region is not recognised as
#      empty. Pass B is markedly better at this (it returns [] on 4 pages), which
#      is why both prompts are reported and neither is promoted.
#   3. IT CANNOT SEPARATE THE DIAGNOSIS FROM THE NOTE. The diagnosis_line crop
#      holds both, plus the top of the medicine list. `diagnosis` is wrong on
#      7 of 7 pages, and on 2 of the 5 pages that record no clinical note at all
#      the model fills `clinical_notes` anyway, usually with a fragment of the
#      diagnosis line or of the "for <name>:" heading below it. Which sentence is
#      which is a content decision the geometry cannot make (config/segment.toml
#      calls that box "deliberately generous" for exactly this reason), so this
#      is the region where a bigger model, not a better crop, is the next lever.
#
# What the system does NOT do anywhere in the table above is silently repair a
# bad read: every null has a recorded reason, and 6 of the 7 dates are null
# because the date is in no crop rather than because a value was invented for it.
#
# ---------------------------------------------------------------------------
# MEASURED RESULT with the settings in this file
# ---------------------------------------------------------------------------
# Real numbers from `python -m src.eval vitals` over the 7 real clinic scans,
# scored against the doctor-verified ground truth in data/fixtures/. Spec section
# 8 forbids evaluating on synthetic data, so these are the only numbers there are.
#
#   field       exact-match acc   on fields the slip records a value for
#   wt_kg       4/7  0.571        4/7  0.571
#   temp_f      5/7  0.714        5/7  0.714
#   spo2_pct    5/7  0.714        5/7  0.714
#   hr          7/7  1.000        7/7  1.000
#   mac_cm      7/7  1.000        4/4  1.000
#   abd_cm      7/7  1.000        4/4  1.000
#   OVERALL    35/42 0.833       29/36 0.806
#
#   of the 7 incorrect fields: 4 emitted a wrong value, 3 were WITHHELD by the
#   plausibility ranges below (i.e. the system declined rather than asserted).
#
# THE FOUR OBSERVED FAILURE MODES, all on the real corpus, all diagnosed from
# the crop by eye. Recorded here because they are the input to the next round of
# tuning and to phases 4 and 5 -- not to be tuned away by loosening a check.
#
#   1. DATE-ROW BLEED, and the biggest single loss. The vitals crop's top row is
#      the "Dt" line, and on 2 of 7 pages the model reported a run-together digit
#      string taken from that row as the WEIGHT:
#        page ac9e   wt reported a 6-digit run of the date row's digits
#        page fd12   wt reported an 8-digit run of the date row's digits
#      The prompt explicitly tells the model to ignore the date; a 4B model does
#      not reliably obey. Both were caught by [fields.wt_kg].max and withheld, so
#      nothing false was exported -- but the weight was lost, and weight is what a
#      dose gets checked against (spec section 4.4). The fix is geometric, not
#      textual: give the date its own region, or raise
#      [regions.vitals_column].box_units' top edge in config/segment.toml to start
#      below the Dt row. That is a Phase 2 change and is deliberately not made
#      here -- Phase 3's job was to measure, and re-tuning Phase 2 geometry from
#      inside Phase 3 would make the two stages' numbers incomparable.
#   2. TRAILING DIGIT LOST TO THE SCAN. Page b741: written "24.82 kg", but the
#      "2" is overlapped by the curled-corner shadow blob and the printed "kg";
#      the model read 24.8. Not a model failure -- the digit is not recoverable
#      from the binarised crop.
#   3. BINARISATION-INDUCED DIGIT CONFUSION, 3 of the 7 errors. 97.1 read as
#      98.1, 100.8 as 100.5, 99 as 97. In every case the glyph in the Sauvola
#      output is genuinely ambiguous at full resolution. This is the measurement
#      that argues for re-tuning Phase 1 (or setting [source].stage = "clahe" in
#      config/segment.toml so the VLM sees greyscale rather than 1-bit ink)
#      before reaching for a bigger model.
#   4. THE PRINTED "%" READ AS A DIGIT. Page a19dd: SpO2 written "100 %",
#      reported as 100.1. Withheld by [fields.spo2_pct].max = 100 -- a
#      saturation cannot exceed 100, so this is provably a misread. It is NOT
#      rounded down to 100: see the note in that section.
#
# Read alongside spec section 8's own framing -- "a system that is 70% accurate
# and correctly flags its own 30% is far more useful here than one that is 85%
# accurate and silently wrong". 4 of 42 fields here are silently wrong. Phase 4's
# two-pass agreement and phase 5's flagging exist to move those into the
# withheld column; nothing in Phase 3 pretends to do it yet.
#
# UPDATE, follow-up work done outside Phase 3's scope (as flagged above --
# failure modes 1 and 3 were both fixed at the Phase 1/2 level, not here):
# [regions.vitals_column].box_units' top edge in config/segment.toml was moved
# to y0=0.267 (was 0.16), and config/preprocess.toml's [binarize].method was
# changed to "adaptive_gaussian" (was "sauvola"). Combined, measured result on
# the same 7 real scans: 38/42 (0.905), up from 35/42; wt_kg 6/7 (was 4/7);
# silently-wrong count 3/42 (was 4/42). The numbers directly above are now
# stale -- kept as the historical Phase 3 baseline, not the current state. Full
# sweep (other binarize methods and y0 values tried, why this combo won) is in
# data/out/vitals_fix_review/README.md (gitignored, PHI, local-machine only).
# Failure mode 2 (trailing digit lost to a scan shadow) and 4 (printed "%" read
# as a digit) are unaffected and still open.

# ===========================================================================
[ollama]
# ===========================================================================
# Inference runs through Ollama as a documented local prerequisite (spec
# section 3.2). Verified on the operator's machine: Ollama 0.32.6.
#
# ON "ZERO NETWORK AT RUNTIME" (spec section 1.1), because this section is the
# one place in the codebase that opens a socket and the distinction matters:
#
#   The constraint is that no request may leave the machine. It is NOT that no
#   socket may be opened. Ollama is a separate local process, so talking to it
#   means a loopback HTTP request -- to 127.0.0.1, which is not routed to any
#   network interface and cannot leave the host even with the adapter enabled.
#   The app therefore still functions correctly with the network adapter
#   disabled, which is the test spec section 1.1 sets.
#
#   host is 127.0.0.1 and must stay 127.0.0.1. Never 0.0.0.0, never a LAN
#   address, never a hostname that resolves through DNS -- the same rule spec
#   section 3.2 states for the review UI's bind address, applied to the client
#   side. src/extract/client.py refuses any host outside the configured
#   allowlist below rather than trusting this value blindly, so a typo here
#   cannot silently turn into an off-machine call.
host = "127.0.0.1"
port = 11434

# Hosts this client is permitted to talk to, ever. A loopback literal only.
# src/extract/config.py raises a ConfigError if `host` is not in this list, so
# adding a cloud endpoint requires editing this allowlist -- which spec section
# 10 forbids outright ("no cloud API fallback, even behind a flag, even for
# comparison"). The allowlist exists to make that prohibition mechanical rather
# than a comment.
allowed_hosts = ["127.0.0.1", "::1", "localhost"]

# Endpoint. "generate" = POST /api/generate, "chat" = POST /api/chat.
#
# Measured on qwen3-vl:4b, same image and prompt: both return identical field
# values and the same ~1.9-2.5 s wall time. "generate" is chosen because it is
# the simpler request shape (one prompt string, one image list) and this stage
# has no conversation to maintain -- one narrow single-purpose prompt per region
# is the whole design (spec section 3.4).
#
# CHANGED TO "chat" for Ollama 0.40: only /api/chat can carry
# [model].assistant_prefill (below), which is what stops qwen3-vl:4b from
# thinking on that version. /api/generate has no prefill short of raw mode, and
# raw mode with an image fails on 0.40.14 ("Failed to tokenize prompt").
endpoint = "chat"

# Request timeout. Spec section 3.5 says "assume minutes per page" and this
# machine is CPU-only (spec section 1.2), so the timeout has to tolerate a cold
# model load.
#
# MEASURED on the 7 real vitals crops (420-502 x 598-714 px, 1362 prompt tokens
# each):
#   first call after `ollama serve` starts   216 s      <-- cold: weights off disk
#   first call after a model unload/reload   11.9-14.7 s
#   every subsequent warm call               1.9-2.2 s
# So a whole 7-page batch costs ~15 s warm and ~25 s from a reload. 600 s is
# ~2.8x the worst observed cold-start cost. A timeout is a hard failure here, not
# a retry-and-guess: on timeout the page is reported failed with the elapsed
# time, and no field value is invented for it.
#
# Note against spec section 3.5's "assume minutes per page": on this region that
# assumption is pessimistic by two orders of magnitude, and the reason is exactly
# the one section 3.4 gives for cropping -- 1362 prompt tokens for a 0.3 MPx crop
# instead of the ~10k a full page would cost. It will not stay this cheap once
# phase 4 adds the other five regions and phase 4's second pass doubles them.
timeout_s = 600.0

# Sent as Ollama's `keep_alive`. Holding the model resident between pages turns
# the 216 s cold load into a once-per-batch cost instead of a per-page one --
# which is the difference between 25 s and 25 minutes over a 7-page batch.
# "0" would unload after every call; a duration string keeps it warm.
keep_alive = "10m"

# Fail fast, with the model list, if the configured model is not pulled --
# rather than sending an inference request that returns a 404 the operator has
# to decode. GET /api/tags. Set false only if that endpoint is unavailable on a
# future Ollama version.
preflight_model_check = true

# ===========================================================================
[model]
# ===========================================================================
# Spec section 3.2: "Model name must be a config value, not hardcoded -- the
# operator will want to try DeepSeek-OCR and other small VLMs and compare."
# Change `name` here and re-run; the cache key includes the model name (see
# [cache]) so previous results are kept, not overwritten, and the two can be
# compared with `python -m src.eval vitals` back to back.
#
# qwen3-vl:4b as verified locally: 4.4B params, Q4_K_M, family qwen3vl,
# capabilities [vision, completion, tools, thinking], context length 262144.
name = "qwen3-vl:4b"

# Ask Ollama to constrain output to valid JSON ("json" = JSON mode, "" = off).
#
# WHY, measured: with format off, qwen3-vl:4b spends its whole token budget
# reasoning in prose ("Okay, let's tackle this problem...") and hits the
# num_predict ceiling before emitting any JSON -- done_reason "length", zero
# usable fields. With format = "json" the same prompt and image return a clean
# 6-key object in 67 tokens. This is not a substitute for parsing: src/extract/
# still validates every field and stores null on failure (spec section 1.3), and
# JSON mode only removes the most common way this model wastes a page.
format = "json"

# Sent as Ollama's `think` flag. False because a thinking preamble on a
# six-number transcription task costs tokens and buys nothing measurable here.
#
# READ [model].response_fields BELOW before changing this -- on the verified
# local stack this flag does not behave the way its name suggests.
think = false

# Text sent as the start of the assistant's reply (a final assistant message
# that the model continues). Only valid with [ollama].endpoint = "chat"; "" = off.
#
# WHY, measured 2026-11-06 on Ollama 0.40.14 (which replaced 0.32.6 by
# auto-update on 2026-11-03): `think = false` no longer stops qwen3-vl:4b from
# reasoning. Under every combination of think false/omitted/true, format json/off
# and generate/chat, it writes a `<think>` monologue, hits num_predict=256 and
# emits no JSON (vitals fell to 6/42 on a --refresh run). JSON mode does not
# apply while the model is thinking. Prefilling an EMPTY think block makes it
# answer at once: page 20fd's vitals came back byte-identical to the 0.32.6
# cached reply (22.65 / 98.1 / 100 / 103 / null / null), in the same 61
# tokens, in the `content` field rather than `thinking`. This is presumably
# what 0.32.6's template did for think = false.
assistant_prefill = "<think>\n\n</think>\n\n"

# Which JSON key of Ollama's reply holds the model's answer, tried in order.
#
# THIS IS A MEASURED WORKAROUND, NOT A GUESS, and it is config rather than code
# because it is a property of the local stack and will change under it.
#
#   Verified on Ollama 0.32.6 + qwen3-vl:4b, /api/generate AND /api/chat, with
#   think = false, with think omitted, with and without format = "json":
#   the `response` (or `message.content`) field comes back as the EMPTY STRING
#   every time, and the generated text -- including the well-formed JSON object
#   -- arrives in the `thinking` field instead. done_reason is "stop",
#   eval_count is 65-67, so the tokens were produced; Ollama is simply
#   attributing them to the thinking channel for this model.
#
# So `response` is tried first (the correct field, and the one a fixed Ollama or
# a different model will populate) and `thinking` second. src/extract/pipeline.py
# records WHICH field the payload actually came from, per page, and warns when
# it was not the first choice -- so this quirk is visible in the metrics output
# rather than papered over. Set this to ["response"] alone to see the failure
# honestly instead.
response_fields = ["response", "thinking"]

[model.options]
# Passed straight through as Ollama's `options`. Determinism is the goal: spec
# section 1.3 makes "never guess" the single most important behavioural
# requirement, and a sampled decode is a guess generator -- the same crop would
# return a different weight on each run and neither reading could be trusted or
# reproduced. Greedy decoding also makes the cache in [cache] meaningful: a
# cached value is what re-running would produce, not one draw from a
# distribution.
#
# HOW DETERMINISTIC IS IT REALLY, measured on the 7 real crops rather than
# assumed -- because "temperature 0" is a claim worth testing before relying on
# a cache:
#
#   3 consecutive batches against a WARM server: 42/42 fields identical, three
#   times over. Reproducible.
#
#   Across a model UNLOAD AND RELOAD: 41/42 identical. Page ac9e's wt_kg came
#   back as 23 on the first batch after a cold load and as 231912 on every warm
#   re-run. Verified by unloading (`keep_alive: 0`) and re-running: the pattern
#   flips back and forth reproducibly, so it is a property of the freshly-loaded
#   server state, not of sampling.
#
# Consequence, stated plainly: greedy decoding is reproducible within a warm
# session but NOT guaranteed across a model reload, and this local stack does not
# offer a knob that fixes that. It does not change the accuracy figure here (both
# readings of that field are wrong -- 23 is emitted-wrong, 231912 is withheld by
# the range check, and ground truth is 14.18), but it does mean a cached result
# can differ from what a cold re-run would produce. That is one more reason the
# cache stores the raw reply and the full key: an entry can always be traced to
# what was actually said, rather than assumed to be re-derivable.
temperature = 0.0
top_p = 1.0
top_k = 1
# Fixed so a re-run is byte-identical even if a future Ollama version breaks the
# temperature-0 path.
seed = 0

# Hard ceiling on generated tokens. Measured need with format = "json": 57-71
# tokens for a full six-key object across all 7 real pages. 256 is ~3.5x the
# worst case, enough for a verbose but valid answer, and small enough that a
# model that starts rambling is cut off in seconds instead of minutes. A response
# truncated by this ceiling comes back with done_reason "length" and is reported
# as a parse failure -- nulls, not a partial object patched up with defaults.
# (With format off, the same model hit a 300-token ceiling on prose and produced
# no JSON at all; see [model].format.)
num_predict = 256

# Context window, set explicitly rather than left to the server default so a
# server-side default change cannot silently start truncating the image tokens.
# Measured prompt size with the prompt below and the real crops: 1362 tokens on
# every page (the crops are 420-502 x 598-714 px, so they tokenise to the same
# count). 4096 leaves room for the prompt, the image and the full num_predict
# budget with ~2.4k to spare.
num_ctx = 4096

# ===========================================================================
[inputs]
# ===========================================================================
# Extraction reads the crops Phase 2 already wrote. It does NOT re-run
# preprocessing or segmentation: the crops in data/segments/ are the reviewed
# artefacts (the operator checked them against overlay.png), and re-deriving
# them here would mean two code paths could disagree about what the model was
# shown.

# Where `python -m src.segment run --dump-crops` wrote its crops. Must agree
# with src/segment/pipeline.py's DEFAULT_SEGMENT_ROOT.
segments_dir = "data/segments"

# Which page_ids to extract. Taken from the ground-truth fixtures, because
# data/fixtures/*.json is the only place page_ids are enumerated without
# re-running ingestion -- the same discovery the eval harness uses. Must agree
# with [fixtures].dir in config/eval.toml; when the eval harness drives
# extraction it passes its own value in, so eval.toml wins on that path and
# src/extract warns if the two disagree.
fixtures_dir = "data/fixtures"

# Refuse to send a crop whose Phase 2 manifest says the geometry was not sound
# (page unanchored, or the region box degenerate/clamped away). A crop cut from
# an unanchored page is a crop of an unknown part of the document, and reading
# numbers off it would produce plausible values with no provenance -- exactly
# what spec section 1.3 forbids. Reported as a failure per page, never skipped
# silently. Set false only to deliberately test extraction on bad geometry.
require_manifest_geometry_ok = true

# ===========================================================================
[regions]
# ===========================================================================
# One table per extractable region. Phase 3 defined one (vitals); Phase 4 adds
# the other five from spec section 3.4 and a second prompt for all six.
#
# EVERY region table carries:
#   crop_file       the PNG Phase 2 wrote, as named by src/segment/pipeline.py
#   segment_region  the Phase 2 region name -- part of the spec section 3.5
#                   cache key and of the manifest geometry check
#   prompt          the [prompts.*] table for PASS A
#   prompt_b        the [prompts.*] table for PASS B (spec section 4.1)
#   fields          the [fields.*] tables the region must return, in report order
#
# ON `fields` AND GROUND TRUTH. Every field name is a key of
# Fixture.fields in src/eval/fixtures.py (or, for prescription_line, a key of one
# prescriptions[] entry), and src/extract/config.py refuses to load this file
# otherwise. So extraction output and ground truth are the same shape and are
# compared key-by-key with no translation layer -- the same rule Phase 3 applied
# to the vitals six, extended rather than relaxed.
#
# ON THE TWO PROMPTS. src/extract/config.py also refuses a region whose two
# prompts are the same table: identical passes agree by construction, and an
# agreement rate computed from that would be a fabricated confidence signal --
# exactly what spec section 4 opens by warning against.
#
# ON [regions.X.model_options]. This was added on an assumption that the
# measurement then contradicted, and both halves are recorded because the
# correction is the useful part.
#
#   THE ASSUMPTION: image tokens scale with crop AREA, and the crops differ by
#   ~6x (measured over all 7 real scans, in megapixels):
#     header_strip 0.15-0.21  vitals_column 0.21-0.30  investigations 0.25-0.35
#     complaints 0.56-0.80    prescription line 0.07-0.83  diagnosis 0.93-1.33
#   Phase 3 measured 1362 prompt tokens for the vitals crop and sized num_ctx at
#   4096 from it, so the 1.33 MPx diagnosis crop should have needed ~7300 and
#   would have been silently truncated -- and a truncated image is an unreadable
#   one that the model answers anyway.
#
#   WHAT WAS ACTUALLY MEASURED, prompt_eval_count over all 246 cached Phase 4
#   calls on this stack (Ollama 0.32.13 + qwen3-vl:4b):
#     header_strip           1298-1338 tokens
#     vitals_column          1355-1362
#     investigations_margin  1259-1313
#     complaints_block       1288-1345
#     prescription line      1324-1575
#     diagnosis_line         1311-1577
#   i.e. a 19x range in crop AREA produces a 1.25x range in prompt tokens. The
#   server rescales every image to a fixed token budget before encoding it, so
#   the global 4096 was never in danger and none of the overrides below was
#   needed.
#
# They are kept anyway, for two reasons: the numbers below are the ones the
# measured results in this file were produced with, and changing them now would
# invalidate the cache and the figures; and the rescaling is a property of THIS
# server and model, not a guarantee -- spec section 3.2 requires the model to be
# swappable, and a model that does not clamp would truncate silently. The
# mechanism costs nothing when unused. Everything a region does not override
# (temperature 0, top_k 1, seed 0) still comes from [model.options], the one
# place it is documented.
#
# The real cost of the larger crops is WALL TIME, not context: median 1.2-3.0 s
# per call across the regions, 9.7 minutes of inference for the full two-pass
# run over all 7 pages (246 calls, warm server).

[regions.header]
# The patient-ID + name row (spec section 2, line 1).
crop_file = "header_strip.png"
segment_region = "header_strip"
prompt = "header_v1"
prompt_b = "header_v2"
#
# THE DATE USED TO BE ASKED FOR HERE AND COULD NOT BE FOUND. Fixed 2026-08-17;
# the history is kept because it explains why the two prompts still mention a
# date and why this region no longer scores one.
#
#   The handwritten date is on the "Dt" row of the printed vitals label column,
#   at x > 1.23 anchor units, y 0.156-0.274 (measured on all 7 scans; see
#   [regions.date_row] in config/segment.toml). header_strip stops at x = 1.20
#   (it must, or it would run into the printed vitals labels at 1.233), and
#   vitals_column starts at y = 0.267 -- the Phase 3 follow-up fix (commit
#   a539cea) raised its top edge precisely to exclude that row, because the model
#   was running the date's digits together with the weight. Between the two, the
#   date was in NO Phase 2 crop, and the honest result was a null on all 6
#   recorded dates.
#
#   The fix was geometric: [regions.date_row] in config/segment.toml
#   (x 1.19-1.64, y 0.148-0.272) and [regions.date] below, which reads it. So
#   `date` is gone from this region's `fields` -- header_strip's own crop still
#   cannot see the date and asking a region to report a field its pixels do not
#   contain is how a null gets attributed to the model instead of to the box.
#
#   header_v1 and header_v2 still ASK for a date, and their text is deliberately
#   NOT edited: they are the measured 2/21 configuration, and the extra "date"
#   key they return is simply not read (src/extract/parse.py takes only the
#   fields a region declares). Leaving the ask in also keeps a useful negative
#   control -- it measures whether the model invents a date out of the printed
#   "Registration No." digits that fall inside this crop on 4 of the 7 pages.
#   Measured before and after this change: it does not.
fields = ["patient_id", "patient_name"]

[regions.date]
# The handwritten visit date, on the "Dt" row above the weight.
#
# A REGION OF ITS OWN, and the reason is geometric rather than semantic. The date
# is one short value in a rectangle that no other region can reach: header_strip
# has to stop left of the printed vitals labels, and vitals_column has to start
# below the Dt row or a 4B model runs the date's digits into the weight (commit
# a539cea, measured: two pages lost their weight to exactly that). The crop is
# the smallest in the config -- 420x116 to 502x139 px, 0.05-0.07 MPx against
# vitals_column's 0.21-0.30 -- which is the whole point of spec section 3.4's
# narrow crops: one row, one field, one question.
#
# No [regions.date.model_options]: the global num_ctx 4096 is sized for a
# 0.21-0.30 MPx crop and this one is a quarter of that. Measured after the fact,
# prompt_eval_count over all 14 calls on this crop: 1299-1348 tokens -- the same
# band as header_strip's 1298-1338 despite a crop a third the area, which is one
# more confirmation of the note above [regions.header]: the server rescales every
# image to a fixed token budget, so crop area does not move the context cost.
crop_file = "date_row.png"
segment_region = "date_row"
prompt = "date_v1"
prompt_b = "date_v2"
fields = ["date"]

