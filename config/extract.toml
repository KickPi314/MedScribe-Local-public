crop_file = "diagnosis_line.png"
segment_region = "diagnosis_line"
prompt = "diagnosis_v1"
prompt_b = "diagnosis_v2"
fields = ["diagnosis", "clinical_notes"]

[regions.diagnosis.model_options]
# The largest crop of the five (0.93-1.33 MPx). See the note above [regions.header].
num_ctx = 12288

[regions.investigations]
# Arrow-prefixed requested investigations. Requested on 2 of the 7 real scans.
