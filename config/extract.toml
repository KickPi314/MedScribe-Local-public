text = """
This image is a narrow crop from a handwritten paediatric prescription slip. It
is one row of a small table: the printed label "Dt" is on the left of the crop,
and the visit date is handwritten immediately to the right of it.

Report exactly one thing as a JSON object:
  "date"  the handwritten visit date, as a string, copied character for
